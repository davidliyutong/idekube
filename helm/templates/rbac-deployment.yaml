{{- if .Values.rbac.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "idekube.rbac.fullname" . }}
  labels:
    {{- include "idekube.rbac.labels" . | nindent 4 }}
spec:
  {{- if not .Values.rbac.autoscaling.enabled }}
  replicas: {{ .Values.rbac.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "idekube.rbac.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "idekube.rbac.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "idekube.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "idekube.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: rbac
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.rbac.image.repository }}:{{ .Values.rbac.image.tag }}"
          imagePullPolicy: {{ .Values.rbac.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.rbac.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          env:
            {{- range .Values.rbac.env }}
            - name: {{ .name }}
              value: {{ tpl .value $ | quote }}
            {{- end }}
          {{- with .Values.rbac.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.rbac.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
