{{- if .Values.housekeeper.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "idekube.housekeeper.fullname" . }}
  labels:
    {{- include "idekube.housekeeper.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.housekeeper.replicaCount }}
  selector:
    matchLabels:
      {{- include "idekube.housekeeper.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "idekube.housekeeper.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "idekube.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "idekube.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: housekeeper
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.housekeeper.image.repository }}:{{ .Values.housekeeper.image.tag }}"
          imagePullPolicy: {{ .Values.housekeeper.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.housekeeper.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          env:
            {{- range .Values.housekeeper.env }}
            - name: {{ .name }}
              value: {{ tpl .value $ | quote }}
            {{- end }}
            - name: CLEANUP_INTERVAL
              value: {{ .Values.housekeeper.config.cleanupInterval | quote }}
            - name: CONTAINER_TTL
              value: {{ .Values.housekeeper.config.containerTTL | quote }}
            - name: MAX_IDLE_TIME
              value: {{ .Values.housekeeper.config.maxIdleTime | quote }}
          {{- with .Values.housekeeper.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.housekeeper.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
