# Default values for idekube
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  imagePullSecrets: []
  storageClass: ""

# Controller service - handles CRD operations and core components
controller:
  enabled: true
  replicaCount: 1

  image:
    repository: davidliyutong/idekube-controller
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  resources:
    requests:
      cpu: 50m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

  env:
    - name: DATABASE_HOST
      value: '{{ include "idekube.postgresql.fullname" . }}'
    - name: DATABASE_PORT
      value: "5432"
    - name: DATABASE_NAME
      value: "idekube"
    - name: REDIS_HOST
      value: '{{ include "idekube.redis.fullname" . }}'
    - name: REDIS_PORT
      value: "6379"
    - name: OPA_POLICY_PATH
      value: "/app/configs/policy.rego"
    - name: OPA_DATA_PATH
      value: "/app/configs/data.json"
    - name: LOG_LEVEL
      value: "info"

  envFrom:
    - secretRef:
        name: idekube-secrets

# Housekeeper service - manages lifetime of containers
housekeeper:
  enabled: true
  replicaCount: 1

  image:
    repository: davidliyutong/idekube-housekeeper
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 8082
    targetPort: 8082

  resources:
    requests:
      cpu: 100m
      memory: 512Mi

  # Housekeeper specific configuration
  config:
    # Cleanup interval in seconds
    cleanupInterval: 300
    # Container TTL in seconds
    containerTTL: 3600
    # Max idle time in seconds
    maxIdleTime: 1800

  env:
    - name: DATABASE_HOST
      value: '{{ include "idekube.postgresql.fullname" . }}'
    - name: DATABASE_PORT
      value: "5432"
    - name: DATABASE_NAME
      value: "idekube"
    - name: REDIS_HOST
      value: '{{ include "idekube.redis.fullname" . }}'
    - name: REDIS_PORT
      value: "6379"
    - name: LOG_LEVEL
      value: "info"

  envFrom:
    - secretRef:
        name: idekube-secrets

# Frontend service - hosts the UI
frontend:
  enabled: true
  replicaCount: 1

  image:
    repository: davidliyutong/idekube-frontend
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

  resources:
    requests:
      cpu: 50m
      memory: 256Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

  env:
    - name: API_CONTROLLER_URL
      value: 'http://{{ include "idekube.controller.fullname" . }}:8080'
    - name: API_RBAC_URL
      value: 'http://{{ include "idekube.rbac.fullname" . }}:8081'
    - name: NODE_ENV
      value: "production"

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  hostname: "idekube.example.com"
  certIssuer: "letsencrypt-prod"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  hosts:
    - host: "{{ .Values.ingress.hostname }}"
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend
              port: 80
        - path: /api/controller
          pathType: Prefix
          backend:
            service:
              name: controller
              port: 8080
  tls:
    - secretName: idekube-tls
      hosts:
        - "{{ .Values.ingress.hostname }}"

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    username: idekube
    # SECURITY WARNING: Do not use default password in production!
    # Genera: ""
    database: idekube
    # Name of existing secret containing 'postgres-password' key
    # If set, the 'password' field will be ignored
    existingSecret: ""
  primary:
    persistence:
      enabled: true
      size: 10Gi
      # Storage class for PostgreSQL PVC
      # If not set, will use global.storageClass
      # If global.storageClass is also empty, will use cluster default
      storageClass: ""
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 50m
        memory: 256Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

# Redis configuration
redis:
  enabled: true
  auth:
    # SECURITY WARNING: Do not use default password in production!
    # Generate a strong password: openssl rand -base64 32
    # For production, use existingSecret or set via --set redis.auth.password=<secure-password>
    password: ""
    # Name of existing secret containing 'redis-password' key
    # If set, the 'password' field will be ignored
    existingSecret: ""
  master:
    persistence:
      enabled: true
      size: 8Gi
      # Storage class for Redis PVC
      # If not set, will use global.storageClass
      # If global.storageClass is also empty, will use cluster default
      storageClass: ""
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi
  replica:
    replicaCount: 0
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

# ServiceAccount configuration
serviceAccount:
  create: true
  annotations: {}
  name: "idekube"

# RBAC configuration
rbacConfig:
  create: true

# Pod Security Context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Security Context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Additional secrets (for database passwords, API keys, etc.)
secrets:
  # These will be created as a Secret named idekube-secrets
  # SECURITY WARNING: All secrets MUST be changed in production!
  # 
  # Generate strong passwords and keys:
  #   Password: openssl rand -base64 32
  #   JWT Secret: openssl rand -base64 64
  #   Encryption Key: openssl rand -hex 32
  # 
  # For production deployment, pass secrets via:
  #   --set secrets.DATABASE_PASSWORD=<secure-password> \
  #   --set secrets.RABBITMQ_PASSWORD=<secure-password> \
  #   --set secrets.JWT_SECRET=<secure-jwt-key>
  # 
  # Or create an external secret and reference it in the deployments
  DATABASE_USER: "idekube"
  DATABASE_PASSWORD: ""  # MUST BE SET - see security notes above
  REDIS_PASSWORD: ""  # MUST BE SET - see security notes above
  JWT_SECRET: ""  # MUST BE SET - see security notes above
