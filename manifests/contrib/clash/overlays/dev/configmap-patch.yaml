apiVersion: v1
kind: ConfigMap
metadata:
  name: clash-config
  labels:
    app: clash
data:
  config.yaml: |
    # Clash 配置文件
    # 请根据实际需求修改以下配置
    port: 7890
    socks-port: 7891
    allow-lan: true
    mode: Rule
    log-level: info
    external-controller: 0.0.0.0:8080

    # 代理配置
    proxies: []
    
    # 代理组配置
    proxy-groups: []
    
    # 规则配置
    rules:
      - MATCH,DIRECT
