apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
type: Opaque
stringData:
  # Replace with your Cloudflare API token
  # To create a token:
  # 1. Go to https://dash.cloudflare.com/profile/api-tokens
  # 2. Create a token with "Zone:DNS:Edit" and "Zone:Zone:Read" permissions
  # 3. Scope it to the zones you want to manage
  api-token: "YOUR_CLOUDFLARE_API_TOKEN_HERE"
