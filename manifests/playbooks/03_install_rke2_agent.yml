---
- hosts: all
  become: yes
  vars_prompt:
    - name: "SERVER_HOSTNAME"
      prompt: "What is the server hostname (reachable from agent)"
      private: no

    - name: "max_pods"
      prompt: "Enter max pods per node"
      default: "250"
      private: no

  tasks:
    - name: Check operating system
      fail:
        msg: "This playbook can only be run on Huawei Cloud EulerOS, RedHat, CentOS, AlmaLinux or Rocky Linux."
      when: ansible_distribution not in ['Huawei Cloud EulerOS', 'RedHat', 'CentOS', 'AlmaLinux', 'Rocky']

    - name: Check if /usr/bin/rke2 exists
      stat:
        path: /usr/bin/rke2
      register: rke2_result

    - name: Copy Air-Gap RKE2 files
      block:
        - name: Ensure /tmp/rke2-artifacts directory exists
          file:
            path: /tmp/rke2-artifacts
            state: directory
            mode: '0755'
        - name: Copy RKE2 Binary
          copy:
            src: rke2.linux-arm64.tar.gz
            dest: /tmp/rke2-artifacts/rke2.linux-arm64.tar.gz
            mode: '0755'
        - name: Copy RKE2 images archive
          copy:
            src: rke2-images.linux-arm64.tar.zst
            dest: /tmp/rke2-artifacts/rke2-images.linux-arm64.tar.zst
            mode: '0644'
        - name: Copy RKE2 CNI images archive
          copy:
            src: rke2-images-{{ cni }}.linux-arm64.tar.zst
            dest: /tmp/rke2-artifacts/rke2-images-{{ cni }}.linux-arm64.tar.zst
            mode: '0644'
        - name: Ensure /var/lib/rancher/rke2/agent/images directory exists
          file:
            path: /var/lib/rancher/rke2/agent/images
            state: directory
            mode: '0755'
        - name: Copy RKE2 images archive to default path
          copy:
            src: /tmp/rke2-artifacts/rke2-images.linux-arm64.tar.zst
            dest: /var/lib/rancher/rke2/agent/images/rke2-images.linux-arm64.tar.zst
            remote_src: yes
            mode: '0644'
        - name: Copy RKE2 CNI images archive to default path
          copy:
            src: /tmp/rke2-artifacts/rke2-images-{{ cni }}.linux-arm64.tar.zst
            dest: /var/lib/rancher/rke2/agent/images/rke2-images-{{ cni }}.linux-arm64.tar.zst
            remote_src: yes
            mode: '0644'
        - name: Copy RKE2 install script
          copy:
            src: install.sh
            dest: /tmp/rke2-artifacts/install.sh
            mode: '0755'
        - name: Copy RKE2 sha256sum file
          copy:
            src: sha256sum-arm64.txt
            dest: /tmp/rke2-artifacts/sha256sum-arm64.txt
            mode: '0755'
      when: rke2_result.stat.exists == False

    - name: Configure RKE2
      block:
        - name: Run RKE2 install script
          shell: |
            INSTALL_RKE2_ARTIFACT_PATH=/tmp/rke2-artifacts INSTALL_RKE2_TYPE="agent" sh /tmp/rke2-artifacts/install.sh
          when: rke2_result.stat.exists == False

        - name: Ensure RKE2 configuration directory exists
          file:
            path: /etc/rancher/rke2
            state: directory
            mode: '0755'

        - name: Write RKE2 server configuration
          copy:
            content: |
              server: https://{{ SERVER_HOSTNAME }}:9345
              token: "{{ lookup('file', './rke2_node_token') }}"
              kubelet-arg: "--max-pods={{ max_pods }}"
            dest: /etc/rancher/rke2/config.yaml
            mode: '0644'

    - name: Enable RKE2 Agent service
      systemd:
        name: rke2-agent.service
        enabled: yes
        state: started
...